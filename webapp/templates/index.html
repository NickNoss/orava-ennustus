<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Orava-ennustus</title>
</head>

<body>
    <h2>Lataa kuvat ja detections.csv</h2>
    <form method="POST" action="/run" enctype="multipart/form-data">
        <label>Kuvat (zip tai useita kuvia):</label><br>
        <input type="file" name="images" multiple><br><br>

        <label>Detections CSV:</label><br>
        <input type="file" name="csv_file" required><br><br>

        <button type="submit">Suorita ennustus</button>
    </form>
</body>

</html>
